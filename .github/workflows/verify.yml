name: Verify Skill
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pinned
        name: Read pinned Norm revision
        shell: pwsh
        run: |
          $revision = ./scripts/verify.ps1 -PrintRevision
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: normlanguage/Norm
          ref: ${{ steps.pinned.outputs.revision }}
          path: Norm
      - name: Check pinned skill
        shell: pwsh
        run: ./scripts/verify.ps1 -NormRoot Norm
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - name: Verify reproducible API Skill
        shell: pwsh
        run: |
          ./scripts/generate.ps1 -NormRoot Norm
          git diff --exit-code -- SKILL.md
