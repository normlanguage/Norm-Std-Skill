name: Verify Skill
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: normlanguage/Norm
          ref: codex/skill-distribution
          path: Norm
      - name: Check pinned skill
        shell: pwsh
        run: ./scripts/verify.ps1 -NormRoot Norm


